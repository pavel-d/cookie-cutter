<div
  class="cbanner-govuk-cookie-banner govuk-!-display-none-print"
  role="region"
  aria-label="Cookies on HMRC services"
>
  <div
    class="cbanner-govuk-cookie-banner__message cbanner-govuk-width-container"
  >
    <div class="cbanner-govuk-grid-row">
      <div class="cbanner-govuk-grid-column-two-thirds">
        <h2
          class="cbanner-govuk-cookie-banner__heading cbanner-govuk-heading-m"
        >
          Cookies on HMRC services
        </h2>
        <div class="cbanner-govuk-cookie-banner__content">
          <p class="cbanner-govuk-body">
            We use some essential cookies to make our services work.
          </p>
          <p class="cbanner-govuk-body">
            We would like to set additional cookies so we can remember your
            settings, understand how people use our services and make
            improvements.
          </p>
        </div>
      </div>
    </div>
    <div class="cbanner-govuk-button-group">
      <button
        value="accept"
        type="submit"
        name="cookies"
        class="cbanner-govuk-button"
      >
        Accept additional cookies
      </button>
      <button
        value="reject"
        type="submit"
        name="cookies"
        class="cbanner-govuk-button"
      >
        Reject additional cookies
      </button>
      <a class="cbanner-govuk-link" href="#">View cookie preferences</a>
    </div>
  </div>
</div>
