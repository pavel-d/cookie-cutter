<div
  class="cbanner-govuk-cookie-banner govuk-!-display-none-print"
  role="region"
  aria-label="Cookies on HMRC services"
>
  <div
    class="cbanner-govuk-cookie-banner__message cbanner-govuk-width-container"
  >
    <div class="cbanner-govuk-grid-row">
      <div class="cbanner-govuk-grid-column-two-thirds">
        <div class="cbanner-govuk-cookie-banner__content">
          <p>
            You have accepted additional cookies. You can
            <a class="cbanner-govuk-link" href="#">
              change your cookie settings
            </a>
            at any time.
          </p>
        </div>
      </div>
    </div>

    <div class="cbanner-govuk-button-group">
      <button class="cbanner-govuk-button">Hide cookies message</button>
    </div>
  </div>
</div>
