<div
  class="govuk-cookie-banner"
  role="region"
  aria-label="Cookies on Government Gateway"
>
  <div class="govuk-cookie-banner__message govuk-width-container">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">
        <h2 class="govuk-cookie-banner__heading govuk-heading-m">
          Cookies on Government Gateway
        </h2>
        <div class="govuk-cookie-banner__content">
          <p class="govuk-body">
            We use some essential cookies to make this service work.
          </p>
          <p class="govuk-body">
            We’d also like to use analytics cookies so we can understand how
            people use this service and make improvements.
          </p>
        </div>
      </div>
    </div>
    <div class="govuk-button-group">
      <button type="submit" name="aoc" value="Y" class="govuk-button">
        Accept analytics cookies
      </button>
      <button type="submit" name="aoc" value="N" class="govuk-button">
        Reject analytics cookies
      </button>
      <a class="govuk-link" href="#">View cookies</a>
    </div>
  </div>
</div>
