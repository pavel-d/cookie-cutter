<div
  id="ccc-module"
  class="ccc-module--slideout ccc-module--left"
  role="dialog"
>
  <div id="ccc-content" class="ccc-content--dark ccc-content--no-outline">
    <div id="cc-panel" class="ccc-panel">
      <h2 id="ccc-title">
        This site uses cookies to store information on your computer.
      </h2>
      <div id="ccc-button-holder">
        <button
          id="ccc-recommended-settings"
          class="ccc-notify-button ccc-link ccc-tabbable ccc-accept-button"
        >
          <span>Accept Recommended Settings</span></button
        ><button
          id="ccc-reject-settings"
          class="ccc-notify-button ccc-link ccc-tabbable ccc-reject-button"
        >
          <span>I Do Not Accept</span>
        </button>
      </div>
    </div>
  </div>
</div>
