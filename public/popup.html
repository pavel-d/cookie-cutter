<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cookie Cutter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" width="20" height="20" alt="" />
      <h1>Cookie Cutter</h1>
    </header>
    <h2>Popups closed</h2>
    <dl id="stats" aria-busy="true">
      <div>
        <dt>On this page</dt>
        <dd id="page-closed">—</dd>
      </div>
      <div>
        <dt>All time</dt>
        <dd id="total-closed">—</dd>
      </div>
    </dl>
    <p id="stats-error" role="status"></p>
    <section class="report" aria-label="Report a popup">
      <p>Something still in the way?</p>
      <button id="report" type="button">
        <svg
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M8 1v3m0 8v3M1 8h3m8 0h3"
            stroke="currentColor"
            stroke-linecap="round"
          />
          <circle cx="8" cy="8" r="4" stroke="currentColor" /></svg
        >Report a popup
      </button>
      <p class="detail">
        Select an element to send page HTML, a screenshot, its selector, your
        public IP and browser details to Linear. HTML may include personal
        information.
      </p>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
