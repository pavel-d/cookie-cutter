name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chrome and Chromium with system dependencies
        run: npx playwright install --with-deps chromium chrome
      - name: Check formatting, types, extension, backend and browsers
        run: npm run check
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package the tested extension
        working-directory: dist
        run: zip -r ../cookie-cutter-extension.zip .
      - name: Upload tested extension ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cookie-cutter-extension
          path: cookie-cutter-extension.zip
          retention-days: 14
